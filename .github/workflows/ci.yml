name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run examples:build
      - name: Pack release artifact
        run: node scripts/pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-core-tarball
          path: release/*.tgz
